# svc service definitions (github.com/mzvonar/svc) — used on the Linux devbox
# only; macOS has no `svc` and uses `setup-dev.sh --watch` instead.
# `svc up dev-watch` / `svc status` / `svc logs dev-watch`.

[dev-watch]
# `pnpm dev` = tsc --watch over both packages, so packages/*/dist follows every
# edit to packages/*/src. That is what makes the globally-linked
# `refdiff` / `refdiff-annotator` CLIs (which run from dist) live
# in dev mode. No port; singleton because dist is a single shared build output
# per checkout, and two watchers would fight over the same files.
cmd = "pnpm dev"
singleton = true

[annotator]
# The impl under test for the annotator redesign (docs/plan-annotator-redesign.md):
# the annotator serving the committed demo root. 7378 is the CLI default, but
# another worktree's annotator may hold it — svc hands out the next free port
# via $PORT, and the manifest run passes that as --app-url.
# --read-only: this instance is the impl under MEASUREMENT (a committed fixture);
# the app must not write annotations/triage/focus into it. A review session that
# needs to save notes runs its own instance without the flag on another port.
cmd = "sh -c 'exec refdiff-annotator fixtures/demo-root --serve --read-only --port ${PORT:-7378}'"
port_base = 7378

[annotator-tailnet]
# The same read-only demo-root instance, reachable from the tailnet only: bound to
# this node's Tailscale IP (derived at start), never 0.0.0.0 — the devbox has a
# public interface and no firewall. Tailscale Serve would proxy 127.0.0.1:<port>
# instead, but it is not enabled on the tailnet. URL: http://<node>.<magicdns>:<PORT>/
cmd = "sh -c 'exec refdiff-annotator fixtures/demo-root --serve --read-only --host \"$(tailscale ip -4)\" --port ${PORT:-7390}'"
port_base = 7390
